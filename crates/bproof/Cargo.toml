[package]
name = "bproof"
version = "0.2.1"
edition.workspace = true

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
bip32 = { version = "0.5.3", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "2.2.2", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5.2", default-features = false }
proof-core = { path = "../proof-core" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
rlimit = "0.11.0"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std"] }
